server:
  port: 8082

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: product-service
              uri: http://localhost:8080
              predicates:
                - Path=/api/v1/products/**
            - id: inventory-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/inventory/**,/api/v1/reservations/**